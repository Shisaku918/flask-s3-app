<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Changer le mot de passe - Explorateur S3</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1745929201306-5fc843dce4dc?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .change-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    input {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1rem;
    }

    input::placeholder {
      color: #ccc;
    }

    button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
    }


    .flash-messages {
      margin-bottom: 16px;
    }

    .flash-messages li {
      list-style: none;
      background: rgba(255, 0, 0, 0.2);
      padding: 10px;
      border-radius: 8px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="change-container">
    <h1>Changer le mot de passe</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="flash-messages">
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('main.change_password') }}">
      <input type="password" name="old_password" placeholder="Ancien mot de passe" required />
      <input type="password" name="new_password" placeholder="Nouveau mot de passe" required />
      <input type="password" name="confirm_password" placeholder="Confirmer le nouveau mot de passe" required />
      <button type="submit">Changer le mot de passe</button>
    </form>

    <div style="margin-top: 20px;">
      <a href="{{ url_for('main.index') }}" style="color: cyan; text-decoration: none;">Retour à l'accueil</a>
    </div>
  </div>
</body>
</html>
